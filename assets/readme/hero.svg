<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="ns-title ns-desc">
  <title id="ns-title">Next steps — three follow-up prompts suggested above the composer after every finished turn in DeepSeek Harness</title>
  <desc id="ns-desc">Left: the plugin name and promise. Right: the composer with three numbered suggestion chips above it, labelled next:, each numbered one to three.</desc>

  <defs>
    <linearGradient id="ns-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BDB"/>
      <stop offset="1" stop-color="#7048E8"/>
    </linearGradient>
    <linearGradient id="ns-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0D0F16"/>
      <stop offset="1" stop-color="#08090D"/>
    </linearGradient>
    <linearGradient id="ns-send" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BDB"/>
      <stop offset="1" stop-color="#7048E8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#ns-bg)"/>

  <g id="title-block" transform="translate(64 72)">
    <g id="mark">
      <rect width="40" height="40" rx="10" fill="url(#ns-mark)"/>
      <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="2.2" opacity="0.94">
        <path d="M9 13.5h15"/>
        <path d="M9 20h17"/>
        <path d="M9 26.5h11"/>
        <path d="M29.5 15.5 34 20l-4.5 4.5" stroke-width="2.4" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="54" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2.2" fill="#878FA3">DEEPSEEK HARNESS PLUGIN</text>

    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="76" font-weight="700" letter-spacing="-1.6" fill="#F4F6FA">Next steps</text>

    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="25" fill="#C2C8D7">Three prompts you were</text>
    <text x="0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="25" fill="#C2C8D7">about to type, suggested</text>
    <text x="0" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="25" fill="#C2C8D7">the moment a turn ends.</text>

    <text x="0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#6E7689">MIT · no dependencies · one short call per turn</text>
  </g>

  <g id="band" transform="translate(470 154)">
    <text x="0" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#6E7689">next:</text>

    <g transform="translate(58 0)">
      <rect width="186" height="48" rx="13" fill="#141824" stroke="#2A3142"/>
      <circle cx="24" cy="24" r="11" fill="#171B26" stroke="#2E3446"/>
      <text x="24" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA2B6">1</text>
      <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#C9CFDD">run the tests</text>
    </g>

    <g transform="translate(256 0)">
      <rect width="186" height="48" rx="13" fill="#141824" stroke="#2A3142"/>
      <circle cx="24" cy="24" r="11" fill="#171B26" stroke="#2E3446"/>
      <text x="24" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA2B6">2</text>
      <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#C9CFDD">settings page</text>
    </g>

    <g transform="translate(454 0)">
      <rect width="172" height="48" rx="13" fill="#141824" stroke="#2A3142"/>
      <circle cx="24" cy="24" r="11" fill="#171B26" stroke="#2E3446"/>
      <text x="24" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA2B6">3</text>
      <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#C9CFDD">commit + PR</text>
    </g>

    <text x="642" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#5E6678">dismiss</text>
  </g>

  <g id="composer" transform="translate(470 230)">
    <rect width="666" height="108" rx="18" fill="#12141C" stroke="#272C3A"/>
    <text x="28" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#5E6678">Ask anything…</text>
    <circle cx="606" cy="54" r="20" fill="url(#ns-send)"/>
    <path d="M606 46v16M599 53l7-7 7 7" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>
</svg>
