<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="ns-flow-title ns-flow-desc">
  <title id="ns-flow-title">How Next steps works: a finished turn, the host half, and the browser half</title>
  <desc id="ns-flow-desc">A three-step flow. A completed turn ends. The host half reads the last ten messages, asks the session's own model for suggestions, cleans them and keeps them in memory. The browser half shows them as chips above the composer and as a sidebar panel, polling the plugin's state route.</desc>

  <rect width="1200" height="680" rx="28" fill="#0C0E14"/>

  <g id="rail" stroke="#232A38" stroke-width="2">
    <path d="M88 142v316"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- step 1 -->
    <circle cx="88" cy="120" r="22" fill="#12141C" stroke="#2E3446" stroke-width="2"/>
    <text x="88" y="128" text-anchor="middle" font-size="20" fill="#93A3FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
    <text x="150" y="112" font-size="30" font-weight="700" fill="#F2F4F8">A turn ends</text>
    <text x="150" y="154" font-size="19" fill="#9AA2B6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">session/event · turn/end · reason: completed</text>
    <text x="150" y="186" font-size="18" fill="#6E7689">Other end reasons, and subagent sessions, are ignored.</text>

    <!-- step 2 -->
    <circle cx="88" cy="300" r="22" fill="#12141C" stroke="#2E3446" stroke-width="2"/>
    <text x="88" y="308" text-anchor="middle" font-size="20" fill="#93A3FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text>
    <text x="150" y="292" font-size="30" font-weight="700" fill="#F2F4F8">The host half asks the session's own model</text>

    <g id="steps" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
      <rect x="150" y="316" width="218" height="44" rx="12" fill="#141824" stroke="#2A3142"/>
      <text x="169" y="344" fill="#C9CFDD">last 10 messages</text>
      <text x="384" y="345" font-size="20" fill="#4C5468">→</text>

      <rect x="416" y="316" width="207" height="44" rx="12" fill="#141824" stroke="#2A3142"/>
      <text x="435" y="344" fill="#C9CFDD">session's model</text>
      <text x="639" y="345" font-size="20" fill="#4C5468">→</text>

      <rect x="671" y="316" width="161" height="44" rx="12" fill="#141824" stroke="#2A3142"/>
      <text x="690" y="344" fill="#C9CFDD">clean + cap</text>
      <text x="848" y="345" font-size="20" fill="#4C5468">→</text>

      <rect x="880" y="316" width="139" height="44" rx="12" fill="#141824" stroke="#2A3142"/>
      <text x="899" y="344" fill="#C9CFDD">in memory</text>
    </g>
    <text x="150" y="398" font-size="18" fill="#6E7689">One cheap call per qualifying turn · maxTokens 1600 · 30 s watchdog · nothing written to the session log.</text>

    <!-- step 3 -->
    <circle cx="88" cy="480" r="22" fill="#12141C" stroke="#2E3446" stroke-width="2"/>
    <text x="88" y="488" text-anchor="middle" font-size="20" fill="#93A3FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text>
    <text x="150" y="472" font-size="30" font-weight="700" fill="#F2F4F8">The browser half puts them where you type</text>

    <g id="surface">
      <rect x="150" y="496" width="986" height="112" rx="16" fill="#12141C" stroke="#272C3A"/>
      <text x="176" y="536" font-size="21" font-weight="600" fill="#E9ECF3">The band above the composer</text>
      <text x="176" y="568" font-size="18" fill="#8A92A5">Click one: it becomes a draft. Nothing is sent for you.</text>
      <text x="176" y="592" font-size="16" fill="#5E6678" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">next: (1) run the tests (2) settings (3) commit — dismiss to hide the row</text>
    </g>
    <text x="150" y="640" font-size="18" fill="#6E7689">Polls POST /api/next-steps/state every 2 s for the current session.</text>
  </g>
</svg>
